{% extends "base.html" %}

{% block content %}
  <section class="ui-card mx-auto max-w-md text-center">
    <h1 class="text-2xl font-bold text-brand-charcoal">Logout</h1>
    {% if user.is_authenticated %}
      <p class="mt-3 text-sm text-gray-600">Are you sure you want to log out?</p>
      <form method="post" class="mt-5">
        {% csrf_token %}
        <button type="submit" class="btn-primary">
          Confirm logout
        </button>
      </form>
    {% else %}
      <p class="mt-3 text-sm text-gray-600">You have been logged out.</p>
      <p class="mt-4">
        <a href="{% url 'login' %}" class="btn-link">Log in again</a>
      </p>
    {% endif %}
  </section>
{% endblock %}
