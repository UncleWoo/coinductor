{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Coinductor</title>
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
  </head>
  <body class="page-shell">
    <header class="border-b border-brand-charcoal bg-brand-charcoal shadow-sm">
      <nav class="mx-auto flex max-w-5xl items-center justify-between px-4 py-3">
        <a href="/" class="text-lg font-semibold text-brand-accent hover:text-opacity-90 transition-colors">Coinductor</a>
        <div class="flex items-center gap-4 text-sm">
          {% if user.is_authenticated %}
            <span class="text-brand-accent">Welcome, {{ user.username }}</span>
            <a href="{% url 'logout' %}" class="font-medium text-brand-accent hover:text-opacity-80 transition-colors focus:outline-none focus:ring-2 focus:ring-brand-accent focus:ring-offset-2 focus:ring-offset-brand-charcoal">Logout</a>
          {% else %}
            <a href="{% url 'login' %}" class="font-medium text-brand-accent hover:text-opacity-80 transition-colors focus:outline-none focus:ring-2 focus:ring-brand-accent focus:ring-offset-2 focus:ring-offset-brand-charcoal">Login</a>
            <a href="{% url 'signup' %}" class="font-medium text-brand-accent hover:text-opacity-80 transition-colors focus:outline-none focus:ring-2 focus:ring-brand-accent focus:ring-offset-2 focus:ring-offset-brand-charcoal">Sign Up</a>
          {% endif %}
        </div>
      </nav>
    </header>
    {% if messages %}
      <div class="mx-auto max-w-5xl px-4 py-3">
        {% for message in messages %}
          <div class="mb-2 rounded-brand border border-brand-accent bg-yellow-50 px-4 py-3 text-brand-charcoal shadow-sm">
            {{ message }}
          </div>
        {% endfor %}
      </div>
    {% endif %}
    <main class="mx-auto max-w-5xl px-4 py-8">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
